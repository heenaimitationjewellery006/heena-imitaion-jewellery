[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.11"
  SECRETS_SCAN_ENABLED = "false"

[functions]
  included_files = ["templates/**", "static/**", "database.db"]

# 1. Serve static assets directly (CSS, JS, images, hero slider, uploads)
[[redirects]]
  from = "/static/*"
  to = "/static/:splat"
  status = 200

# 2. Serve static categories & products data for Netlify frontend
[[redirects]]
  from = "/api/categories"
  to = "/static/data/categories.json"
  status = 200

[[redirects]]
  from = "/api/products*"
  to = "/static/data/products.json"
  status = 200

[[redirects]]
  from = "/api/reviews*"
  to = "/static/data/reviews.json"
  status = 200

# 3. Route all client pages to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

