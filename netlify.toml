[build]
  publish = "."

[build.environment]
  SECRETS_SCAN_ENABLED = "false"

# 1. Serve static assets directly (CSS, JS, images, hero slider, uploads)
[[redirects]]
  from = "/static/*"
  to = "/static/:splat"
  status = 200

# 2. Fast static cache for public catalog & categories
[[redirects]]
  from = "/api/categories"
  to = "/static/data/categories.json"
  status = 200

[[redirects]]
  from = "/api/products"
  to = "/static/data/products.json"
  status = 200

[[redirects]]
  from = "/api/reviews"
  to = "/static/data/reviews.json"
  status = 200

# 3. Route Admin Portal & Admin Authentication directly to Render Backend
[[redirects]]
  from = "/admin"
  to = "https://heena-jewellery-backend.onrender.com/admin"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://heena-jewellery-backend.onrender.com/admin/:splat"
  status = 200
  force = true

# 4. Route Dynamic APIs (Orders, Checkout, Auth, Admin APIs, Database) to Render Backend
[[redirects]]
  from = "/api/*"
  to = "https://heena-jewellery-backend.onrender.com/api/:splat"
  status = 200
  force = true

# 5. Route all other storefront URLs to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
