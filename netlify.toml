[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.11"
  SECRETS_SCAN_ENABLED = "false"

[functions]
  included_files = ["templates/**", "static/**", "database.db"]

# 1. Serve static assets directly (CSS, JS, images, hero slider, uploads)
[[redirects]]
  from = "/static/*"
  to = "/static/:splat"
  status = 200

# 2. Route all requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
