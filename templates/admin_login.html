<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | Heena Imitation Jewellery</title>
  <meta name="google-signin-client_id" content="{{ google_client_id }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body {
      background-color: #121214;
      color: #F5F5F7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .admin-login-card {
      background-color: #1E1E24;
      border: 1px solid #383840;
      border-radius: var(--radius-md);
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .admin-logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .admin-logo i {
      font-size: 2.4rem;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }
    .admin-logo-title {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      color: #FFFFFF;
      font-weight: 700;
    }
    .admin-logo-sub {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent-gold);
      margin-top: 2px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #A1A1AA;
      margin-bottom: 8px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid #383840;
      background-color: #161618;
      color: #FFFFFF;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .form-group input:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 3px var(--gold-glow);
    }
    .error-alert {
      background-color: rgba(231, 76, 60, 0.15);
      border: 1px solid #E74C3C;
      color: #F1948A;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="admin-login-card">
    <div class="admin-logo">
      <img src="/static/images/logo.png" alt="Heena Logo" style="height: 64px; width: 64px; border-radius: 50%; object-fit: cover; border: 2.5px solid #C9A15C; background: #FFF; padding: 2px; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(201,161,92,0.3);">
      <div class="admin-logo-title">HEENA</div>
      <div class="admin-logo-sub">Store Admin Portal</div>
    </div>

    <div class="error-alert" id="adminErrorMsg"></div>

    <form onsubmit="handleAdminLogin(event)">
      <div class="form-group">
        <label>Admin ID *</label>
        <input type="text" id="adminIdInput" required placeholder="Enter Admin ID..." autocomplete="off">
      </div>

      <div class="form-group">
        <label>Admin Password *</label>
        <input type="password" id="adminPassInput" required placeholder="Enter Admin Password..." autocomplete="current-password">
      </div>

      <button type="submit" class="btn-gold" style="width: 100%; font-size: 1rem; padding: 14px;">
        Authenticate Admin <i class="fa-solid fa-right-to-bracket"></i>
      </button>
    </form>

    <div style="margin-top: 24px; text-align: center; border-top: 1px solid #2D2D35; padding-top: 18px;">
      <a href="/" style="font-size: 0.85rem; color: #A1A1AA; text-decoration: none;"><i class="fa-solid fa-arrow-left"></i> Back to Customer Store</a>
    </div>
  </div>

  <script>
    async function handleAdminLogin(event) {
      event.preventDefault();
      const adminId = document.getElementById('adminIdInput').value.trim();
      const password = document.getElementById('adminPassInput').value.trim();
      const errBox = document.getElementById('adminErrorMsg');

      errBox.style.display = 'none';

      try {
        const res = await fetch('/admin/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ admin_id: adminId, password: password })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/admin/dashboard';
        } else {
          errBox.textContent = data.message || 'Invalid Admin ID or Password.';
          errBox.style.display = 'block';
        }
      } catch (err) {
        errBox.textContent = 'Server connection failed.';
        errBox.style.display = 'block';
      }
    }
  </script>
</body>
</html>
